name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          ALEXA_KEYSTORE_BASE64: ${{ secrets.ALEXA_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ALEXA_KEYSTORE_BASE64}" ]]; then
            echo "Missing secret ALEXA_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/keystore"
          printf '%s' "${ALEXA_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore/release.keystore"
          echo "ALEXA_KEYSTORE=${RUNNER_TEMP}/keystore/release.keystore" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          ALEXA_KEYSTORE_PASSWORD: ${{ secrets.ALEXA_KEYSTORE_PASSWORD }}
          ALEXA_KEY_PASSWORD: ${{ secrets.ALEXA_KEY_PASSWORD }}
          ALEXA_KEY_ALIAS: ${{ secrets.ALEXA_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          "${ANDROID_HOME}"/build-tools/*/apksigner verify --print-certs "$APK" | head -5
          cp "$APK" alexandroid.apk

      - name: Remove keystore
        if: always()
        run: rm -rf "${RUNNER_TEMP}/keystore"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: alexandroid-apk
          path: alexandroid.apk

      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::8}"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" alexandroid.apk --clobber && exit 0
            else
              gh release create "$TAG" alexandroid.apk --prerelease --target "$GITHUB_SHA" \
                --title "Alexandroid ${TAG}" --notes "Signed APK built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}." && exit 0
            fi
            echo "attempt ${attempt} failed, retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
